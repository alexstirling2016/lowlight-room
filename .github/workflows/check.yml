name: Check Low Light Mixes

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch: {}    # the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the blog, comments and Mixcloud
        run: python scripts/fetch.py
      - name: Save changes
        run: |
          git config user.name "low-light-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data art
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily check $(date -u +%Y-%m-%d)"
            git push
          fi
