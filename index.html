<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Low Light Listening Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-radio cue sheet. One reading column (≤ 64rem) with a mix grid; each mix opens as a page whose tracklist is a clickable cue sheet with a time strip. Dark-first. */
:root{
  --ground:#13141d; --surface:#1a1c28; --surface-2:#232635; --line:#2d3043;
  --ink:#e7e3da; --muted:#9295a8; --glow:#dba8c8; --glow-ink:#1d1420; --tape:#86c9bd; --bar:#e48cc4; --warn:#e7a46a;
  --display:"Young Serif","Iowan Old Style",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --haze:rgba(219,168,200,.10);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --ground:#efeef3; --surface:#f8f7fb; --surface-2:#e6e4ee; --line:#d4d1df;
  --ink:#1d1e27; --muted:#5d5f73; --glow:#8b3c72; --glow-ink:#fff6fb; --tape:#1d6b60; --bar:#8b3c72; --warn:#9a5413; --haze:rgba(139,60,114,.07); color-scheme:light}}
:root[data-theme="light"]{
  --ground:#efeef3; --surface:#f8f7fb; --surface-2:#e6e4ee; --line:#d4d1df;
  --ink:#1d1e27; --muted:#5d5f73; --glow:#8b3c72; --glow-ink:#fff6fb; --tape:#1d6b60; --bar:#8b3c72; --warn:#9a5413; --haze:rgba(139,60,114,.07); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:1rem/1.6 var(--body);
  background-image:radial-gradient(ellipse 80% 45% at 85% -10%,var(--haze),transparent 70%);background-attachment:fixed}
a{color:var(--glow);text-underline-offset:.2em;text-decoration-thickness:1px}
a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:3px}
.page{max-width:64rem;margin:0 auto;padding-block:1.2rem 7rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spaced{font:700 .72rem/1 var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.7rem 1.5rem;padding-bottom:.9rem;border-bottom:1px solid var(--line)}
.word{margin:0;font:1.55rem/1 var(--display);letter-spacing:.01em}
.word a{color:var(--ink);text-decoration:none}
.word small{font:400 .78rem var(--body);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-left:.6rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem}
nav.tabs a{color:var(--muted);text-decoration:none;padding:.2rem 0;border-bottom:1px solid transparent;font-size:.95rem}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--glow)}

.view{margin-top:2rem}
h1.v{font:400 clamp(1.9rem,4.6vw,2.7rem)/1.1 var(--display);margin:0 0 .5rem;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 1.5rem;max-width:62ch}

/* hero (latest mix) */
.hero{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:1.6rem;align-items:end;margin:1.6rem 0 2.4rem}
@media(max-width:40rem){.hero{grid-template-columns:1fr}.hero .cover{max-width:15rem}}
.hero h2{font:400 clamp(1.7rem,4vw,2.4rem)/1.1 var(--display);margin:.35rem 0 .5rem;text-wrap:balance}
.hero h2 a{color:var(--ink);text-decoration:none}
.hero p{margin:.3rem 0;max-width:58ch;color:var(--muted)}

/* covers */
.cover{position:relative;aspect-ratio:1;max-width:100%;border-radius:.35rem;overflow:hidden;background:var(--surface-2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .gen{position:absolute;inset:0;display:flex;align-items:flex-end;padding:.6rem;font:2.2rem/1 var(--display);color:rgba(255,248,240,.85)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.9rem}
.filters input[type=search]{flex:1 1 16rem;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.5rem .6rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.4rem}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:.18rem .7rem;font-size:.85rem;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--glow);background:var(--surface)}
.chip em{font-style:normal;color:var(--muted);font-size:.75rem;margin-left:.3rem;font-variant-numeric:tabular-nums}
.count{font-size:.88rem;color:var(--muted);margin:0 0 1rem}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.6rem 1.2rem}
.card{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.card a.t{color:var(--ink);text-decoration:none;font:400 1.08rem/1.25 var(--display)}
.card a.t:hover{text-decoration:underline;text-decoration-color:var(--glow)}
.card .meta{font-size:.8rem;color:var(--muted)}
.card .hits{margin:.1rem 0 0;padding:0;list-style:none;font-size:.82rem}
.card .hits li{display:flex;gap:.4rem;min-width:0}
.card .hits a{font-family:var(--mono);font-size:.78rem;color:var(--tape);text-decoration:none;flex:none}
.card .hits span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.more{display:block;margin:2rem auto 0;background:none;border:1px solid var(--line);border-radius:999px;padding:.5rem 1.4rem;cursor:pointer;color:var(--muted)}
.mark-dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--glow);margin-right:.35rem;vertical-align:.1em}

/* mix page */
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.92rem}
.mixhead{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr);gap:1.8rem;align-items:end;margin-top:1.2rem}
@media(max-width:42rem){.mixhead{grid-template-columns:1fr}.mixhead .cover{max-width:17rem}}
.mixhead h1{font:400 clamp(1.9rem,5vw,3rem)/1.06 var(--display);margin:.4rem 0 .6rem;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:.88rem;color:var(--muted)}
.labels{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.labels a{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:.08rem .6rem;color:var(--muted);text-decoration:none}
.labels a:hover{color:var(--ink);border-color:var(--glow)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem .6rem;align-items:center;margin-top:1.1rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.45rem 1rem;font-size:.92rem;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.primary{background:var(--glow);border-color:var(--glow);color:var(--glow-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07);color:var(--glow-ink)}
.btn[aria-pressed="true"]{border-color:var(--glow);color:var(--glow)}
.btn svg{width:.9rem;height:.9rem;fill:currentColor}
.intro{margin:1.8rem 0 0;max-width:64ch;white-space:pre-line}
.note{font-size:.88rem;color:var(--muted);margin:.6rem 0 0}
.note.warn{color:var(--warn)}

/* cue strip + tracklist */
.cue{margin-top:2.4rem}
.cue h2,.sect h2{margin:0 0 .9rem}
.strip{position:relative;display:flex;height:2.4rem;border-radius:.3rem;overflow:hidden;background:var(--surface-2);cursor:pointer}
.strip .seg{display:block;position:relative;flex:none;border:0;border-right:1px solid var(--ground);padding:0;margin:0;cursor:pointer;background:color-mix(in srgb,var(--glow) calc(var(--k)*1%),var(--surface-2))}
.strip .seg:hover,.strip .seg.now{background:var(--tape)}
.strip .head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none;left:0}
.ticks{display:flex;justify-content:space-between;font:.72rem var(--mono);color:var(--muted);margin-top:.3rem}
ol.tl{list-style:none;margin:1.2rem 0 0;padding:0;counter-reset:n}
ol.tl li{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto;gap:.2rem 1rem;padding:.55rem 0;border-bottom:1px solid var(--line);align-items:baseline}
ol.tl li.now{background:linear-gradient(90deg,var(--haze),transparent)}
ol.tl li.now .who::before{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--tape);margin-right:.45rem;vertical-align:.12em}
.ts{font:500 .92rem var(--mono);color:var(--tape);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:none;font-variant-numeric:tabular-nums}
.ts:hover{color:var(--ink);text-decoration:underline}
span.ts{cursor:default;color:var(--muted)}
.who{font-weight:700}
.rowacts{display:flex;gap:.1rem;align-self:center}
.morebtn{background:none;border:0;padding:.2rem .35rem;margin:-.2rem 0;cursor:pointer;color:var(--muted);border-radius:.3rem;font:700 1.05rem/1 var(--body)}
.morebtn:hover{color:var(--tape)}
.why2{display:block;font-size:.82rem;color:var(--tape)}
.more-head{margin-top:1.2rem}
.more-head h1{font:400 clamp(1.7rem,4.5vw,2.6rem)/1.1 var(--display);margin:.3rem 0 .4rem;text-wrap:balance}
.like{background:none;border:0;padding:.2rem .35rem;margin:-.2rem 0;cursor:pointer;color:var(--muted);line-height:0;border-radius:.3rem;align-self:center}
.like svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:1.7}
.like:hover{color:var(--ink)}
.like[aria-pressed="true"]{color:var(--glow)}
.like[aria-pressed="true"] svg{fill:currentColor}
ol.tl.liked .ts{font-size:.85rem}
.what{color:var(--ink)}
.alb{display:block;font-size:.85rem;color:var(--muted)}
.alb a{font-size:.82rem}
.sect{margin-top:2.6rem}
.links{columns:2 16rem;column-gap:2rem;margin:0;padding:0;list-style:none;font-size:.88rem}
.links li{break-inside:avoid;margin:0 0 .35rem;overflow-wrap:anywhere}
.mood{border:1px dashed var(--tape);border-radius:.45rem;padding:1rem 1.1rem;max-width:64ch}
.mood b{color:var(--tape)}
.mood .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.mood .tags span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .55rem}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.92rem}
.pager a{text-decoration:none;max-width:48%}
.pager small{display:block;color:var(--muted)}

/* artists */
.alist{display:flex;flex-direction:column}
.arow{border-bottom:1px solid var(--line)}
.arow>button{display:flex;width:100%;justify-content:space-between;gap:1rem;background:none;border:0;padding:.65rem 0;cursor:pointer;text-align:left}
.arow>button b{font:400 1.1rem var(--display)}
.arow>button span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.arow ul{list-style:none;margin:0 0 .9rem;padding:0;font-size:.9rem;display:flex;flex-direction:column;gap:.3rem}
.arow li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.8rem}
.arow li small{color:var(--muted)}
.arow li .like{margin:0 0 0 .2rem;vertical-align:-.15em;line-height:0}
.arow li .like svg{width:.9rem;height:.9rem}
.lh{color:var(--glow);margin-left:.45rem;line-height:0}
.lh svg{width:.8rem;height:.8rem;fill:currentColor;vertical-align:-.05em}
.arow>button span.sub{display:block;font-size:.8rem;color:var(--muted);white-space:normal;margin-top:.1rem}

/* ask */
.askbox{border:1px solid var(--line);border-radius:.6rem;background:var(--surface);padding:1rem 1.1rem}
.askbox textarea{width:100%;min-height:4.6rem;resize:vertical;border:0;background:transparent;outline:none;font:1.15rem/1.5 var(--body)}
.askbox textarea::placeholder{color:var(--muted)}
.askrow{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:.7rem}
.examples{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 0}
.picks{display:flex;flex-direction:column;gap:1.6rem;margin-top:2rem}
.pick{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:1.1rem}
.pick h3{font:400 1.35rem/1.15 var(--display);margin:0}
.pick h3 a{color:var(--ink);text-decoration:none}
.pick p{margin:.35rem 0 0;max-width:60ch}
.pick .why{color:var(--ink)}
.pick blockquote.q{margin:.6rem 0 0;padding-left:.8rem;border-left:2px solid var(--glow);font-style:italic;color:var(--ink);max-width:60ch}
details.desc{margin-top:.6rem;font-size:.9rem}
details.desc summary{cursor:pointer;color:var(--glow)}
details.desc p{white-space:pre-line;color:var(--muted);max-width:64ch;margin:.5rem 0 0}
.status{display:flex;gap:.6rem;align-items:center;color:var(--muted);font-size:.9rem;margin-top:1rem}
.status i{width:.5rem;height:.5rem;border-radius:50%;background:var(--glow);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.status i{animation:none}}

/* panels */
.panel{border:1px solid var(--line);border-radius:.5rem;background:var(--surface);padding:1.1rem 1.2rem;margin-bottom:1.4rem;max-width:46rem}
.panel h3{font:400 1.3rem var(--display);margin:0 0 .5rem}
.panel p{margin:.4rem 0}
.state{display:flex;gap:.5rem;align-items:baseline}
.state i{flex:none;width:.6rem;height:.6rem;border-radius:50%;display:inline-block;background:var(--muted)}
.state.ok i{background:var(--tape)} .state.warn i{background:var(--warn)}
.steps{margin:.6rem 0 0;padding-left:1.3rem}
.steps li{margin:.35rem 0}
.steps code,.panel code{font:.86rem var(--mono);background:var(--surface-2);padding:.05rem .35rem;border-radius:.25rem;overflow-wrap:anywhere}
.inrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.inrow input{flex:1 1 14rem;min-width:0;background:var(--ground);border:1px solid var(--line);border-radius:.4rem;padding:.5rem .7rem;font-family:var(--mono);font-size:.9rem}
.msg{font-size:.9rem;margin:.5rem 0 0}
.msg.err{color:var(--warn)} .msg.good{color:var(--tape)}
.empty{border:1px dashed var(--line);border-radius:.6rem;padding:2rem 1.4rem;text-align:left;max-width:46rem}
.empty h2{font:400 1.6rem var(--display);margin:0 0 .5rem}

/* player bar (GitHub Pages copy only) */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:.55rem max(16px,env(safe-area-inset-right,0px)) calc(.55rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:64rem;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem 1rem;align-items:center}
.player .now{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.player .now b{color:var(--ink)}
.player .ctl{display:flex;gap:.4rem}
.player .ctl button{background:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;font-size:.82rem;cursor:pointer;color:var(--muted)}
.player .ctl button[aria-pressed="true"]{color:var(--ink);border-color:var(--glow)}
.player .ctl button.plike{display:inline-flex;align-items:center;gap:.35rem}
.player .ctl button.plike svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:1.8}
.player .ctl button.plike[aria-pressed="true"]{color:var(--glow);border-color:var(--glow)}
.player .ctl button.plike[aria-pressed="true"] svg{fill:currentColor}
.player .ctl button.plike:disabled{opacity:.4;cursor:default}
@media(max-width:30rem){.player .ctl button.plike span{display:none}}
.player .slot{grid-column:1/-1;min-width:0}
.player iframe{display:block;width:100%;height:60px;border:0}
.player audio{display:block;width:100%}
.toast{position:fixed;left:50%;bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;font-size:.9rem;z-index:30;max-width:calc(100vw - 32px)}
/* charts */
.cchart{margin-top:.6rem}
.cplot{position:relative;height:11rem;margin-left:2.4rem}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.gl em{position:absolute;right:calc(100% + .4rem);top:-.55rem;font:normal .7rem var(--mono);color:var(--muted)}
.ccols{position:absolute;inset:0;display:flex;align-items:stretch;gap:2px}
.col{flex:1 1 0;min-width:0;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:flex-end}
.col i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.col:hover i,.col:focus-visible i,.col.sel i{background:var(--tape)}
.cx{display:flex;gap:2px;margin-left:2.4rem;margin-top:.3rem;overflow:hidden}
.cx span{flex:1 1 0;min-width:0;overflow:visible;white-space:nowrap;font:.7rem var(--mono);color:var(--muted)}
.rchart{display:flex;flex-direction:column;gap:.55rem;margin-top:.6rem}
.row{display:flex;flex-direction:column;gap:.25rem;min-width:0;max-width:100%;overflow:hidden;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.row .rl{display:block;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.row .rl b{font-weight:400;color:var(--ink)}
.row .rl em{font:normal .78rem var(--mono);color:var(--muted)}
.row i{display:block;height:.6rem;background:var(--bar);border-radius:0 4px 4px 0}
.row:hover i,.row:focus-visible i,.row.sel i{background:var(--tape)}
.row:hover b{text-decoration:underline;text-decoration-color:var(--tape)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:1rem;margin:1.6rem 0}
.stat b{display:block;font:400 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
table.caps{width:100%;border-collapse:collapse;font-size:.9rem}
table.caps th,table.caps td{text-align:left;padding:.45rem .6rem .45rem 0;border-bottom:1px solid var(--line);vertical-align:top}
table.caps th{color:var(--muted);font-weight:400}
table.caps td:nth-child(3),table.caps td:nth-child(4){font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.linkbtn{background:none;border:0;padding:0;color:var(--glow);cursor:pointer;text-decoration:underline}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:.35rem;padding:.3rem .6rem;font-size:.82rem;max-width:18rem}
.gh{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.gh a{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem;text-decoration:none;color:var(--muted)}
.gh a:hover{color:var(--ink);border-color:var(--glow)}
footer{margin-top:4rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);max-width:64ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="page">
  <header class="mast">
    <p class="word"><a href="#mixes">Low Light</a><small>listening room</small></p>
    <nav class="tabs" aria-label="Sections">
      <a href="#mixes" data-tab="mixes">Mixes</a>
      <a href="#artists" data-tab="artists">Artists</a>
      <a href="#ask" data-tab="ask">Ask</a>
      <a href="#yours" data-tab="yours">Yours</a>
      <a href="#listening" data-tab="listening">Listening</a>
      <a href="#about" data-tab="about">About</a>
    </nav>
  </header>
  <main id="main"></main>
  <footer>Mixes, words and covers belong to <a href="https://lowlightmixes.blogspot.com" target="_blank" rel="noopener">Low Light Mixes</a>; the music belongs to its artists. This room only indexes what the blog publishes and links back to it, Mixcloud and the artists' pages.<span id="ghLinks"></span></footer>
</div>
<div class="player" id="player" hidden>
  <div class="in">

    return '<li>' + (m ? tsLink(m, t) : '<span class="ts">·</span>') + '<div><span class="who">' + h(x.artist || '') + '</span>' + (x.artist ? ' – ' : '') + '<span class="what">' + h(x.title || '') + '</span><span class="alb">' + (m ? 'in <a href="' + h(mixHash(m)) + '">' + h(m.title) + '</a>' : '') + (x.album ? (m ? ' · ' : '') + h(x.album) : '') + '</span></div><span class="rowacts">' + (m && idxOf(m, t) >= 0 ? moreBtn(m, idxOf(m, t), true) : '') + likeBtn(t) + '</span></li>';
  }).join('') + '</ol>' : '<p class="lede">' + (STANDALONE ? 'Tap the heart next to a track, or the Like button in the player while it plays.' : 'Tap the heart next to a track in any tracklist. Likes from the player copy arrive here with the daily task.') + '</p>';
  function grid(list, none) { return list.length ? '<div class="grid">' + list.map(function (m) { return cardHtml(m); }).join('') + '</div>' : '<p class="lede">' + none + '</p>'; }
  main.innerHTML = '<section class="view"><h1 class="v">Yours</h1><p class="lede">' + (STANDALONE ? 'Kept in this browser.' : (S.uid ? 'Private to you: nobody else who opens this room sees these.' : 'Kept in this browser for now.')) + '</p>' +
    '<section class="sect" style="margin-top:1rem"><h2 class="spaced">L i k e d &nbsp; t r a c k s</h2>' + likedHtml + (STANDALONE && lk.length ? '<p class="note">' + (Log.cfg ? 'Also saved to your private repository, so they follow you to other devices.' : 'Connect a private repository on the Listening page to keep these on every device.') + '</p>' : '') + '</section>' +
    '<section class="sect"><h2 class="spaced">A r t i s t s &nbsp; y o u ’ v e &nbsp; l i k e d</h2><p class="note">Everyone behind a track you liked. Open one to see everything of theirs in the archive; the times play from that spot.</p><div class="alist" id="likedArts"></div></section>' +
    '<section class="sect"><h2 class="spaced">F a v o u r i t e &nbsp; m i x e s</h2>' + grid(fav, 'Mark a mix as a favourite from its page.') + '</section>' +
    '<section class="sect"><h2 class="spaced">R e c e n t l y &nbsp; o p e n e d</h2>' + grid(recent, 'Mixes you open appear here.') + '</section>' +
    '<section class="sect"><h2 class="spaced">H e a r d</h2>' + grid(heard, 'Mixes you mark as heard. Ask only uses this when you ask for something new, or something you know.') + '</section></section>';
  function drawLA() {
    var box = $('likedArts'); if (!box) return;
    var la = likedArtists();
    box.innerHTML = la.length ? la.map(function (x) {
      var open = S.openLiked === x.key, a = x.a, n = a ? a.n : 0, nt = a ? a.apps.length : 0;
      return '<div class="arow"><button type="button" data-la="' + h(x.key) + '" aria-expanded="' + open + '"><span style="white-space:normal;color:inherit;font-size:inherit"><b>' + h(x.name) + '</b><span class="sub">liked: ' + h(x.liked.map(function (y) { return y.title; }).filter(Boolean).slice(0, 3).join(', ') + (x.liked.length > 3 ? '…' : '')) + '</span></span><span>' + (n ? nt + (nt === 1 ? ' track' : ' tracks') + ' in ' + n + (n === 1 ? ' mix' : ' mixes') : 'not in the tracklists') + '</span></button>' +
        (open && a ? '<ul>' + appsNewest(a).map(appRow).join('') + '</ul>' : '') + '</div>';
    }).join('') : '<p class="lede">Like a track and its artist appears here.</p>';
  }
  drawLA();
  var lab = $('likedArts');
  if (lab) lab.addEventListener('click', function (e) { var b = e.target.closest('[data-la]'); if (!b) return; S.openLiked = S.openLiked === b.dataset.la ? null : b.dataset.la; drawLA(); });
  var ll = $('likedList');
  if (ll) ll.addEventListener('click', function (e) {
    var b = e.target.closest('button.like'); if (!b) return;
    var x = (S.memory.tracks || {})[b.dataset.k]; if (!x) return;
    setLike(x.slug, { artist: x.artist, title: x.title, album: x.album, sec: x.sec }, !x.on);
    renderYours(main);
  });
}

// ------------------------------------------------------------ ABOUT
function renderAbout(main) {
  var mon = S.monitor, repo = S.config.repo || '', pu = pagesUrl();
  var html = '<section class="view"><h1 class="v">How this room works</h1><p class="lede">A free GitHub check reads the Low Light Mixes blog every day, including its comments and the Mixcloud listings. ' + (STANDALONE ? 'This copy reads the check’s files directly and can play the mixes.' : 'A daily Claude task copies new mixes in here. A second copy of this room, hosted by GitHub, holds the player, because claude.ai pages can’t embed Mixcloud or play outside audio.') + '</p>';
  html += '<div class="panel"><h3>Daily check</h3>';
  if (mon && mon.lastCheck) {
    var stale = Date.now() - Date.parse(mon.lastCheck) > 2 * DAY;
    html += '<p class="state ' + (stale ? 'warn' : 'ok') + '"><i></i>' + (stale ? 'The last check was ' + ago(mon.lastCheck) + '. It may have stopped; open the repository’s Actions tab to see why.' : 'Read the blog ' + ago(mon.lastCheck) + (mon.lastResult ? ': ' + h(mon.lastResult) + '.' : '.')) + '</p>';
    if (mon.lastSync) html += '<p class="msg">Copied into this room ' + ago(mon.lastSync) + '.' + (mon.syncNotes ? ' ' + h(mon.syncNotes) : '') + '</p>';
    if (mon.syncProblem) html += '<p class="msg err">' + h(mon.syncProblem) + '</p>';
  } else if (mon && mon.syncProblem) {
    html += '<p class="state warn"><i></i>The daily copy could not read the check: ' + h(mon.syncProblem) + '</p>';
  } else {
    html += '<p class="state"><i></i>Not running yet.</p>';
  }
  html += '</div>';
  if (!STANDALONE) {
    html += '<div class="panel"><h3>Repository</h3>' + (repo ? '<p>Reading <a href="https://github.com/' + h(repo) + '" target="_blank" rel="noopener"><code>' + h(repo) + '</code></a>' + (pu ? ' · player copy at <a href="' + h(pu) + '" target="_blank" rel="noopener">' + h(pu.replace(/^https:\/\//, '')) + '</a>' : '') + '</p>' : '<p>No repository set yet. The daily copy waits until it has one.</p>') +
      (S.canEdit && S.db ? '<form class="inrow" id="repoF"><label class="sr" for="repoIn">GitHub repository (owner/name)</label><input id="repoIn" placeholder="your-name/lowlight-room" value="' + h(repo) + '" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">Save</button></form><p class="msg" id="repoMsg" aria-live="polite"></p>' : '<p class="note">Only editors of this room can change it.</p>') + '</div>';
  }
  if (ghRepo()) html += '<div class="panel"><h3>On GitHub</h3><p>Shortcuts for when Claude hands you a file to put on GitHub: <b>Upload files</b> opens the upload page of <code>' + h(ghRepo()) + '</code>; drop the file in and press <b>Commit changes</b>.</p>' + ghLinksHtml() + '</div>';
  html += '<div class="panel"><h3>Setting it up (once, about ten minutes)</h3><ol class="steps">' +
    '<li>On GitHub, create a new <b>public</b> repository, for example <code>lowlight-room</code>.</li>' +
    '<li>Choose <b>Add file → Upload files</b> and drop in everything from the <code>lowlight-room</code> folder you were given (<code>index.html</code>, <code>README.md</code>, the <code>scripts</code> folder). Commit.</li>' +
    '<li>Choose <b>Add file → Create new file</b>, name it <code>.github/workflows/check.yml</code>, paste the contents of <code>check.yml</code> and commit. (This step is separate because folders starting with a dot are hidden on a Mac.)</li>' +
    '<li>In <b>Settings → Pages</b>, set Source to “Deploy from a branch”, branch <code>main</code>, folder <code>/ (root)</code>, and save. That is the player copy.</li>' +
    '<li>In the <b>Actions</b> tab, open “Check Low Light Mixes” and press <b>Run workflow</b>. The first run reads all ~620 posts and saves the covers; it takes a few minutes.</li>' +
    '<li>' + (STANDALONE ? 'Put <code>owner/name</code> into the claude.ai room’s About page so the daily copy can start.' : 'Type <code>owner/name</code> into the box above and save. The next daily copy fills this room; covers and mood readings arrive over the following days.') + '</li></ol></div>';
  html += '<div class="panel"><h3>Where things live</h3><p>The check stores everything in the repository’s <code>data/mixes.json</code> and <code>art/</code> folder. Tracklists come from the post, or from a comment when the post has none. ' + (STANDALONE ? 'Heard and favourite marks in this copy stay in this browser.' : 'Your heard and favourite marks are stored privately per person; the mixes are shared and only the daily task writes them.') + '</p><p>Mood readings are written by Claude from each post’s words, labels and tracklist, and say so. Claude never hears the audio.</p></div></section>';
  main.innerHTML = html;
  var f = $('repoF');
  if (f) f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('repoIn').value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/, '').replace(/\/+$/, '');
    var msg = $('repoMsg');
    if (!/^[A-Za-z0-9-]+\/[A-Za-z0-9._-]+$/.test(v)) { msg.className = 'msg err'; msg.textContent = 'Write it as owner/name, for example alex/lowlight-room.'; return; }
    var body = Object.assign({}, S.config, { repo: v, setAt: new Date().toISOString() });
    S.db.doc('meta/config').set(body).then(function () { S.config = body; msg.className = 'msg good'; msg.textContent = 'Saved. The next daily copy will read ' + v + '.'; })
      .catch(function () { msg.className = 'msg err'; msg.textContent = 'Could not save. Only editors of this room can change it.'; });
  });
}

// ------------------------------------------------------------ boot
route();
if (STANDALONE) {
  fetch('data/mixes.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { var ms = d && d.mixes ? Object.keys(d.mixes).map(function (k) { return d.mixes[k]; }) : []; setMixes(ms); })
    .catch(function () { setMixes([]); });
  if (Log.cfg) Likes.sync();
  fetch('data/status.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { if (s) { S.monitor = s; if (S.tab === 'about') route(); } }).catch(function () {});
} else {
  S.sampleP = Promise.resolve(window.claude.use('sample')).catch(function () { return null; });
  (async function () {
    var db = await window.claude.use('db');
    var user = await window.claude.use('user');
    if (!db) { setMixes([]); return; }
    S.db = db;
    try { S.canEdit = user ? await user.canEdit() : false; } catch (e) {}
    try { S.uid = user ? await user.id() : null; } catch (e) {}
    db.doc('meta/config').onSnapshot(function (s) { S.config = s.exists ? Object.assign({}, s.data()) : {}; if (S.tab === 'about' || S.tab === 'mix') route(); }, function () {});
    db.doc('meta/monitor').onSnapshot(function (s) { S.monitor = s.exists ? s.data() : null; if (S.tab === 'about') route(); }, function () {});
    var first = true;
    db.collection('mixes').onSnapshot(function (snap) {
      var keep = S.tab === 'mix' || S.tab === 'artists';
      var y = window.scrollY;
      setMixes(snap.docs.map(function (d) { return Object.assign({ slug: d.id }, d.data()); }));
      if (!first && keep) window.scrollTo(0, y);
      first = false;
    }, function () { setMixes([]); });
    if (S.uid) db.doc('data/users/' + S.uid + '/memory').get().then(function (s) {
      if (s.exists) { var d = s.data() || {}; S.memory = { marks: Object.assign({}, S.memory.marks, d.marks || {}), recent: d.recent || S.memory.recent || [], tracks: mergeTracks(S.memory.tracks, d.tracks) }; lsSet('lowlight-memory', S.memory); if (S.tab === 'yours') route(); }
    }).catch(function () {});
    if (S.uid) db.collection('data/users/' + S.uid).onSnapshot(function (snap) {
      var ses = {}, sy = null, mem = null;
      snap.docs.forEach(function (d) {
        if (/^listen-\d{4}-\d{2}$/.test(d.id)) { var x = d.data() || {}; Object.assign(ses, x.sessions || {}); }
        else if (d.id === 'sync') sy = d.data();
        else if (d.id === 'memory') mem = d.data();
      });
      Log.data.sessions = ses; S.sync = sy; S._listen = null; S._tracks = null;
      if (mem && mem.tracks) S.memory.tracks = mergeTracks(S.memory.tracks, mem.tracks);
      if (S.tab === 'listening') drawListening(); else if (S.tab === 'yours' || S.tab === 'mix') route();
    }, function () {});
    S.sample = await S.sampleP;
  })();
}
})();
</script>

</body></html>
